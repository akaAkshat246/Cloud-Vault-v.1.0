openapi: 3.1.0
info:
  title: CloudVault API Specification
  version: 1.0.0
  description: |
    Single Source of Truth for the CloudVault Zero-Knowledge E2EE Storage Backend API.
    All binary payloads are encrypted client-side and transferred directly to S3 via presigned multipart URLs.
servers:
  - url: http://localhost:4000
    description: Local Development Server
  - url: https://api.cloudvault.app
    description: Production API Gateway

paths:
  /health:
    get:
      summary: Liveness Probe
      description: Returns 200 OK if the backend Node.js process is active and running.
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: integer
                    example: 3600

  /ready:
    get:
      summary: Readiness Probe
      description: Checks database and object storage connectivity.
      responses:
        '200':
          description: All critical dependencies are healthy and ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  timestamp:
                    type: string
                    format: date-time
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        example: ok
                      storage:
                        type: string
                        example: ok
        '503':
          description: One or more critical subsystems (DB, S3) are degraded or down
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: degraded
                  checks:
                    type: object

  /api/v1/auth/prelogin:
    post:
      summary: Anti-User Enumeration Pre-Login
      description: Returns KDF parameters and salt. For unknown emails, returns deterministic fake salt matching real response shape and timing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: KDF parameters and salt
          content:
            application/json:
              schema:
                type: object
                properties:
                  kdf_version:
                    type: string
                    example: "1.0"
                  kdf_params:
                    type: object
                    properties:
                      m:
                        type: integer
                        example: 65536
                      t:
                        type: integer
                        example: 3
                      p:
                        type: integer
                        example: 1
                  salt:
                    type: string
                    example: "0102030405060708090a0b0c0d0e0f10"

  /api/v1/auth/register:
    post:
      summary: User Registration
      description: Registers new account with client-derived AuthKey hash and wrapped Master Key blobs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - authKey
                - salt
                - encrypted_master_key
                - master_key_nonce
                - encrypted_recovery_master_key
                - recovery_master_key_nonce
              properties:
                email:
                  type: string
                  format: email
                authKey:
                  type: string
                  minLength: 64
                  maxLength: 64
                  description: 32 bytes derived from password in hex
                salt:
                  type: string
                  minLength: 32
                  maxLength: 32
                  description: 16 bytes random salt in hex
                kdf_version:
                  type: string
                  default: "1.0"
                kdf_params:
                  type: object
                encrypted_master_key:
                  type: string
                master_key_nonce:
                  type: string
                encrypted_recovery_master_key:
                  type: string
                recovery_master_key_nonce:
                  type: string
      responses:
        '201':
          description: User registered successfully
        '409':
          description: Email already registered

  /api/v1/auth/login:
    post:
      summary: User Login
      description: Verifies client-derived AuthKey, returns wrapped MasterKey blobs, 15-min JWT access token, and sets 7-day httpOnly refresh cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, authKey]
              properties:
                email:
                  type: string
                  format: email
                authKey:
                  type: string
                deviceName:
                  type: string
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: cv_refresh_token=...; HttpOnly; Secure; SameSite=Strict
        '401':
          description: Invalid email or credentials
        '429':
          description: Account temporarily locked due to multiple failed attempts

  /api/v1/auth/refresh:
    post:
      summary: Refresh Access Token
      description: Rotates refresh token in family and issues new 15-min access token. Automatic family revocation on reuse detection.
      responses:
        '200':
          description: Token rotated successfully
        '401':
          description: Invalid, expired, or reused token

  /api/v1/auth/logout:
    post:
      summary: Logout Current Session
      description: Revokes the caller's refresh token and clears cookie.
      responses:
        '200':
          description: Logged out successfully

  /api/v1/auth/logout-all:
    post:
      summary: Logout All Sessions
      description: Revokes all refresh tokens and sessions for authenticated user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All sessions revoked

  /api/v1/auth/sessions:
    get:
      summary: List Active User Sessions
      description: Returns active devices and sessions for authenticated user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active sessions list

  /api/v1/auth/recovery/confirm:
    post:
      summary: Confirm Emergency Recovery Kit Challenge
      description: Client confirms that the user successfully passed the 4-word random challenge response.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Recovery kit confirmed

  /api/v1/auth/change-password:
    post:
      summary: Change Password
      description: Re-wraps Master Key with new KEK. Zero file re-encryption required.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Password changed successfully

  /api/v1/auth/recovery/unlock:
    post:
      summary: Forgot Password Path A (Recovery Unlock)
      description: Vault recovered client-side using 24-word phrase; uploads new password credentials.
      responses:
        '200':
          description: Vault unlocked and password updated

  /api/v1/auth/account-reset:
    post:
      summary: Forgot Password Path B (Account Reset)
      description: Cryptographic data loss when phrase is lost. Marks files orphaned with 30-day grace period.
      responses:
        '200':
          description: Account reset initiated

  /api/v1/auth/me:
    get:
      summary: Get User Profile & Quota
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile and storage statistics

  /api/v1/files/uploads:
    post:
      summary: Initiate Direct-to-S3 Multipart Upload with Two-Phase Quota Reservation
      description: Atomically reserves quota, checks recovery kit gate, creates file metadata placeholder, and initiates S3 multipart upload.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - file_id
                - total_size_bytes
                - total_chunks
                - encrypted_metadata
                - metadata_nonce
                - encrypted_fek
                - fek_nonce
              properties:
                file_id:
                  type: string
                  format: uuid
                total_size_bytes:
                  type: integer
                  minimum: 0
                total_chunks:
                  type: integer
                  minimum: 1
                parent_id:
                  type: string
                  format: uuid
                  nullable: true
                encrypted_metadata:
                  type: string
                metadata_nonce:
                  type: string
                encrypted_fek:
                  type: string
                fek_nonce:
                  type: string
      responses:
        '201':
          description: Multipart upload initiated and quota reserved
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_id:
                    type: string
                    format: uuid
                  s3_upload_id:
                    type: string
                  s3_key:
                    type: string
                  chunk_size_bytes:
                    type: integer
                    example: 5242907
        '400':
          description: Validation error or invalid UUID
        '401':
          description: Unauthorized
        '403':
          description: Recovery Kit not confirmed (write-locked)
        '413':
          description: Quota exceeded

  /api/v1/files/uploads/{id}/parts:
    post:
      summary: Batch Request Presigned S3 Multipart Upload URLs
      description: Issues short-lived (1 hour) presigned PUT URLs for specified 1-based chunk part numbers.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [part_numbers]
              properties:
                part_numbers:
                  type: array
                  items:
                    type: integer
                    minimum: 1
      responses:
        '200':
          description: Presigned part URLs
          content:
            application/json:
              schema:
                type: object
                properties:
                  parts:
                    type: array
                    items:
                      type: object
                      properties:
                        part_number:
                          type: integer
                        presigned_url:
                          type: string
                        expires_in_seconds:
                          type: integer
        '401':
          description: Unauthorized
        '404':
          description: Upload session not found or already closed

  /api/v1/files/uploads/{id}:
    get:
      summary: Resumable Upload Status Check
      description: Queries S3 ListParts to return which chunks have been received and verified by S3.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Upload session status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: uploading
                  parts_uploaded:
                    type: array
                    items:
                      type: object
                      properties:
                        part_number:
                          type: integer
                        etag:
                          type: string
                        size_bytes:
                          type: integer
                  total_chunks:
                    type: integer
        '401':
          description: Unauthorized
        '404':
          description: Upload session not found

  /api/v1/files/uploads/{id}/complete:
    post:
      summary: Finalize Multipart Upload & Convert Quota
      description: Verifies all parts, completes S3 multipart upload, checks actual object size via HeadObject, and atomically converts reserved quota to active storage quota.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parts]
              properties:
                parts:
                  type: array
                  items:
                    type: object
                    required: [part_number, etag]
                    properties:
                      part_number:
                        type: integer
                      etag:
                        type: string
      responses:
        '200':
          description: File finalized and ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  size_bytes:
                    type: integer
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: Part count or size verification mismatch
        '401':
          description: Unauthorized
        '404':
          description: Upload session not found

  /api/v1/files/uploads/{id}/abort:
    post:
      summary: Abort Multipart Upload & Release Quota
      description: Aborts S3 multipart upload, deletes temporary storage, releases reserved quota, and marks session aborted.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Upload aborted and quota released
          content:
            application/json:
              schema:
                type: object
                properties:
                  aborted:
                    type: boolean
                    example: true
        '401':
          description: Unauthorized
        '404':
          description: Upload session not found

  /api/v1/files/{id}/download-info:
    get:
      summary: Request Presigned Download URL with HTTP Range Support
      description: Returns wrapped File Encryption Key (FEK), metadata, total chunk count, and presigned GET S3 URL supporting HTTP Range byte streams.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Download info and presigned URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_id:
                    type: string
                    format: uuid
                  download_url:
                    type: string
                  size_bytes:
                    type: integer
                  total_chunks:
                    type: integer
                  format_version:
                    type: integer
                    example: 1
                  encrypted_fek:
                    type: string
                  fek_nonce:
                    type: string
                  encrypted_metadata:
                    type: string
                  metadata_nonce:
                    type: string
        '401':
          description: Unauthorized
        '404':
          description: File not found or trashed

  /api/v1/files:
    get:
      summary: List Files in Vault or Folder
      security:
        - BearerAuth: []
      parameters:
        - name: parent_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            nullable: true
        - name: include_trashed
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of file metadata records
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    size_bytes:
                      type: integer
                    encrypted_metadata:
                      type: string
                    metadata_nonce:
                      type: string
                    is_trashed:
                      type: boolean
                    created_at:
                      type: string
                      format: date-time
        '401':
          description: Unauthorized

  /api/v1/files/{id}:
    get:
      summary: Get File Metadata
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: File metadata
        '401':
          description: Unauthorized
        '404':
          description: File not found
    patch:
      summary: Update Encrypted File Metadata or Move File
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id:
                  type: string
                  format: uuid
                  nullable: true
                encrypted_metadata:
                  type: string
                metadata_nonce:
                  type: string
      responses:
        '200':
          description: File updated
        '401':
          description: Unauthorized
        '404':
          description: File not found
    delete:
      summary: Soft Delete File (Move to Trash)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: File moved to trash
          content:
            application/json:
              schema:
                type: object
                properties:
                  trashed:
                    type: boolean
                    example: true
        '401':
          description: Unauthorized
        '404':
          description: File not found

  /api/v1/files/{id}/restore:
    post:
      summary: Restore File from Trash
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: File restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored:
                    type: boolean
                    example: true
        '401':
          description: Unauthorized
        '404':
          description: File not found in trash

  /api/v1/files/{id}/permanent:
    delete:
      summary: Permanently Delete File & Free S3 Storage Quota
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: File deleted permanently from S3 and database
          content:
            application/json:
              schema:
                type: object
                properties:
                  permanently_deleted:
                    type: boolean
                    example: true
        '401':
          description: Unauthorized
        '404':
          description: File not found

  /api/v1/folders:
    post:
      summary: Create Encrypted Folder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - encrypted_metadata
                - metadata_nonce
              properties:
                parent_id:
                  type: string
                  format: uuid
                  nullable: true
                encrypted_metadata:
                  type: string
                metadata_nonce:
                  type: string
      responses:
        '201':
          description: Folder created
        '401':
          description: Unauthorized
    get:
      summary: List Folders
      security:
        - BearerAuth: []
      parameters:
        - name: parent_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            nullable: true
      responses:
        '200':
          description: List of folders
        '401':
          description: Unauthorized

  /api/v1/folders/{id}:
    patch:
      summary: Update Folder or Move with Strict Cycle Prevention
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id:
                  type: string
                  format: uuid
                  nullable: true
                encrypted_metadata:
                  type: string
                metadata_nonce:
                  type: string
      responses:
        '200':
          description: Folder updated
        '400':
          description: Folder cycle detected (cannot move folder into its own subtree)
        '401':
          description: Unauthorized
        '404':
          description: Folder not found
    delete:
      summary: Soft Delete Folder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Folder moved to trash
        '401':
          description: Unauthorized
        '404':
          description: Folder not found

  /api/v1/shares/{token}:
    get:
      summary: Access Public Share Link (Milestone M7)
      description: Returns ciphertext download URL for recipient decryption.
      responses:
        '501':
          description: Not Implemented (M7)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: Resource not found
            details:
              type: object
