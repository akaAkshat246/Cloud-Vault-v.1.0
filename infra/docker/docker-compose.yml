services:
  postgres:
    image: postgres:15-alpine
    container_name: cloudvault-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-cloudvault}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudvault_dev_password}
      POSTGRES_DB: ${DB_NAME:-cloudvault_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cloudvault} -d ${DB_NAME:-cloudvault_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudvault-network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: cloudvault-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudvault-network

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: cloudvault-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    networks:
      - cloudvault-network

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: cloudvault-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-cloudvault}
      DB_PASSWORD: ${DB_PASSWORD:-cloudvault_dev_password}
      DB_NAME: ${DB_NAME:-cloudvault_db}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-cloudvault-storage}
      S3_FORCE_PATH_STYLE: "true"
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - cloudvault-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  cloudvault-network:
    driver: bridge

