name: M1 Cryptographic Specification Interoperability Gate

on:
  push:
    paths:
      - 'packages/crypto-spec/**'
      - '.github/workflows/crypto-spec-ci.yml'
  pull_request:
    paths:
      - 'packages/crypto-spec/**'
      - '.github/workflows/crypto-spec-ci.yml'

jobs:
  verify-crypto-spec:
    name: Verify TypeScript & Android Interoperability
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Compile TypeScript Cryptographic Reference
        run: npm --workspace=@cloudvault/crypto-spec run build

      - name: Run TypeScript Verification Test Suite (Vitest)
        run: npm --workspace=@cloudvault/crypto-spec test

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate Android Gradle Project
        working-directory: packages/crypto-spec/android
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew test --info
          else
            echo "Gradle wrapper ready for local Android build."
          fi

